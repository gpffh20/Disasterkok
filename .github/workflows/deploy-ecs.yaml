name: Deploy to ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: disasterkok-dev
  ECS_CLUSTER: disasterkok-dev-cluster
  ECS_SERVICE: disasterkok-dev-service
  ECS_TASK_FAMILY: disasterkok-dev-app

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          -f Disasterkok_backend/Dockerfile \
          Disasterkok_backend/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  migrate:
    name: Run DB Migration (one-off ECS task)
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get network config
        id: net
        run: |
          SUBNETS=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE \
            --query "services[0].networkConfiguration.awsvpcConfiguration.subnets" --output json | jq -c .)
          SG=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE \
            --query "services[0].networkConfiguration.awsvpcConfiguration.securityGroups" --output json | jq -c .)
          echo "subnets=$SUBNETS" >> $GITHUB_OUTPUT
          echo "sg=$SG" >> $GITHUB_OUTPUT

      - name: Run migrate task
        run: |
          # GitHub Actions의 ${{ }} 치환은 셸이 파싱하기 전 텍스트 그대로 삽입되므로,
          # 이중 따옴표 문자열 안에 따옴표 포함 JSON을 직접 끼워넣으면 깨진다.
          # jq로 실제 bash 변수를 안전하게 구성해서 사용한다.
          NETCFG=$(jq -n \
            --argjson subnets '${{ steps.net.outputs.subnets }}' \
            --argjson sg '${{ steps.net.outputs.sg }}' \
            '{awsvpcConfiguration:{subnets:$subnets,securityGroups:$sg,assignPublicIp:"ENABLED"}}')

          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition $ECS_TASK_FAMILY \
            --launch-type FARGATE \
            --network-configuration "$NETCFG" \
            --overrides '{"containerOverrides":[{"name":"gunicorn","command":["python","manage.py","migrate","--noinput"]}]}' \
            --query "tasks[0].taskArn" --output text)
          echo "Waiting for migration task $TASK_ARN..."
          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN
          EXIT_CODE=$(aws ecs describe-tasks --cluster $ECS_CLUSTER --tasks $TASK_ARN \
            --query "tasks[0].containers[0].exitCode" --output text)
          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ] || exit 1

  deploy:
    name: Deploy to ECS Service
    runs-on: ubuntu-latest
    needs: migrate
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

      - name: Wait for service stable
        run: |
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE

      - name: Smoke test
        run: |
          ENI=$(aws ecs list-tasks --cluster $ECS_CLUSTER --service-name $ECS_SERVICE --query "taskArns[0]" --output text | \
            xargs -I{} aws ecs describe-tasks --cluster $ECS_CLUSTER --tasks {} \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
          IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI \
            --query "NetworkInterfaces[0].Association.PublicIp" --output text)
          echo "Testing http://$IP:8000/health/"
          curl -f --retry 5 --retry-delay 5 "http://$IP:8000/health/"
